# Local dev stack: Postgres 16 + API (tsx watch) + Vite dev server.
#   docker compose up --build
# Overridable via .env: API_PORT / WEB_PORT / DB_PORT (if 3000/5173/5432 are taken on the host),
# PUBLIC_WEB_ORIGIN + VITE_API_BASE (to reach the stack from another machine, e.g. over Tailscale:
# PUBLIC_WEB_ORIGIN=http://<tailscale-ip>:5173  VITE_API_BASE=http://<tailscale-ip>:3001).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cerbo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cerbo}
      POSTGRES_DB: ${POSTGRES_DB:-cerbo_store}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-cerbo} -d ${POSTGRES_DB:-cerbo_store}']
      interval: 3s
      timeout: 3s
      retries: 20

  server:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev --workspace server"
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-cerbo}:${POSTGRES_PASSWORD:-cerbo}@db:5432/${POSTGRES_DB:-cerbo_store}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Checkout URLs handed to the "email" stub must point at the host-visible web origin.
      PUBLIC_WEB_ORIGIN: ${PUBLIC_WEB_ORIGIN:-http://localhost:${WEB_PORT:-5173}}
    ports:
      - '${API_PORT:-3000}:3000'
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/api/health || exit 1']
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 20s

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev --workspace web"
    environment:
      VITE_API_BASE: ${VITE_API_BASE:-http://localhost:${API_PORT:-3000}}
      VITE_PROXY_TARGET: http://server:3000
    ports:
      - '${WEB_PORT:-5173}:5173'
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    depends_on:
      # Server runs `npm install` into the shared node_modules volume first; web waits for it to
      # be healthy so the two installs never race on the same directory.
      server:
        condition: service_healthy

volumes:
  pgdata:
  node_modules:
