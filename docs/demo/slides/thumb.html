<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="base.css" />
    <style>
      .shot {
        position: absolute;
        right: 48px;
        top: 215px;
        width: 1000px;
        height: 566px;
        overflow: hidden;
        border: 6px solid #fff;
        box-shadow: 0 14px 40px rgba(0, 0, 0, 0.45);
        background: #fff;
      }
      .shot img {
        width: 1920px;
        height: auto;
        transform: scale(0.5208);
        transform-origin: top left;
      }
      .big {
        position: absolute;
        left: 48px;
        top: 230px;
        width: 780px;
        font-size: 92px;
        line-height: 1.02;
        font-weight: 800;
        color: #fff;
        text-shadow: 0 3px 12px rgba(0, 0, 0, 0.35);
      }
      .tag {
        position: absolute;
        left: 48px;
        top: 560px;
        width: 780px;
        font-size: 38px;
        color: #f8d74a;
        font-weight: 700;
      }
      .eq2 {
        position: absolute;
        left: 48px;
        top: 700px;
        width: 780px;
        font-size: 30px;
        color: #e8edf2;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="slide">
      <img class="logo" src="../../../web/public/cerbo-logo.svg" alt="Cerbo" />
      <div class="big">Supplement store, inside the chart</div>
      <div class="tag">Cerbo take-home · Vue · Fastify · Postgres</div>
      <div class="eq2">
        Order from the chart → patient pays in the portal →<br />
        every cent on an append-only ledger. 75 bps, half-up.
      </div>
      <div class="shot"><img src="../../screenshots/chart.png" alt="" /></div>
    </div>
  </body>
</html>
